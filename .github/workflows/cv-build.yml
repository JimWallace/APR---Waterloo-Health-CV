# Checks and compiles the CV on every PR and on main.
# On main it also publishes the two PDFs to the "cv-latest" release:
#   https://github.com/JimWallace/APR---Waterloo-Health-CV/releases/tag/cv-latest
#
# Errors fail the build, and so does any warning (check_cv.py, biber or LaTeX)
# that is not in scripts/warnings-baseline.txt; see scripts/warning_ratchet.py.
# TeX Live is pinned (texlive_version) so the warnings do not change under us;
# to move to a newer one, change both builds and rerun
# `python3 scripts/warning_ratchet.py --update <docs>` in the same PR.
name: CV build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: # cv-merge, overleaf-sync and the weekly update start this for bot-made branches

permissions:
  contents: read

concurrency:
  group: cv-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test the checkers
        run: python3 -m unittest discover -s scripts/tests
      - name: Check scholar.bib and the category lists (errors, and warnings not in the baseline)
        run: python3 scripts/check_cv.py
      - name: Keep personal data out of the template
        run: |
          if grep -rIn -i 'wallace' template/; then
            echo "::error::template/ must not contain CV data (see template/CLAUDE.md)."
            exit 1
          fi

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compile main.tex and apr.tex (TeX Live, latexmk + biber)
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          texlive_version: 2023
          root_file: |
            main.tex
            apr.tex
      - name: Name the PDFs
        run: |
          mkdir -p out
          cp main.pdf out/Wallace-CV.pdf
          cp apr.pdf  out/Wallace-CV-APR.pdf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cv-pdfs
          path: out/*.pdf
      - name: No warnings beyond the baseline (LaTeX and biber)
        # On main the merge has happened; report, but still publish the PDFs.
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        run: python3 scripts/warning_ratchet.py main apr
      - name: PDF/A-2b (veraPDF)
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        run: scripts/check_pdfa.sh main.pdf apr.pdf
      - name: Fonts embedded; what changed in the PDFs since main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          gh release download cv-latest --pattern 'Wallace-CV*.pdf' --dir ref 2>/dev/null \
            || echo "No cv-latest release to compare with."
          python3 scripts/pdf_report.py main.pdf apr.pdf \
            --against ref/Wallace-CV.pdf ref/Wallace-CV-APR.pdf

  template:
    # The template on its own: its fictional example CV must build in both versions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compile the template example (plain and APR)
        uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # v3
        with:
          texlive_version: 2023
          working_directory: template/example
          root_file: |
            example.tex
            example-apr.tex
      - name: No warnings beyond the baseline (LaTeX and biber)
        run: python3 scripts/warning_ratchet.py example example-apr
      - name: PDF/A-2b (veraPDF)
        run: scripts/check_pdfa.sh template/example/example.pdf template/example/example-apr.pdf

  gate:
    # A PR labelled needs-review can't pass, so nothing merges it by accident.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Block PRs labelled needs-review
        if: contains(github.event.pull_request.labels.*.name, 'needs-review')
        run: |
          echo "::error::This PR is labelled needs-review. Remove the label when you're happy with it."
          exit 1
      - run: echo "No blocking label."

  ratchet:
    # Claude writes, CI verifies, so a change that loosens the verification itself
    # (accepts new warnings, or edits the checks) is not merged automatically.
    # This job fails for such a PR; Jim merges it by hand. Not a required check.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The warning baseline only shrinks
        run: python3 scripts/warning_ratchet.py --growth "$(git merge-base origin/main HEAD)"
      - name: The checks are unchanged
        run: |
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD -- .github/workflows/cv-build.yml \
            .github/workflows/cv-merge.yml scripts/check_cv.py scripts/cvlib.py \
            scripts/warning_ratchet.py scripts/pdf_report.py scripts/check_pdfa.sh scripts/tests)
          if [ -n "$changed" ]; then
            for f in $changed; do echo "::error file=$f::This PR changes the checks; merge it by hand."; done
            exit 1
          fi
          echo "The checks are unchanged."

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cv-pdfs
          path: out
      - name: Update the cv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
          if gh release view cv-latest >/dev/null 2>&1; then
            gh release edit cv-latest --notes "$notes"
          else
            gh release create cv-latest --title "Latest CV" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload cv-latest out/Wallace-CV.pdf out/Wallace-CV-APR.pdf --clobber
