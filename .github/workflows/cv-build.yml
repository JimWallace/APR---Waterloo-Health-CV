# Checks and compiles the CV on every PR and on main.
# On main it also publishes the two PDFs to the "cv-latest" release (and a PR from this
# repository to the "cv-preview" prerelease):
#   https://github.com/JimWallace/APR---Waterloo-Health-CV/releases/tag/cv-latest
#
# Errors fail the build, and so does any warning (check_cv.py, biber or LaTeX)
# that is not in scripts/warnings-baseline.txt; see scripts/warning_ratchet.py.
# TeX Live is pinned to one dated image (docker_image, by digest) so the
# warnings do not change under us. It is TeX Live 2026, the version Overleaf
# compiles new projects with (set its compiler to LuaLaTeX). To move on, change the image in both builds (tags:
# ghcr.io/xu-cheng/texlive-debian, e.g. 20271001) and rerun
# `python3 scripts/warning_ratchet.py --update <docs>` in the same PR.
name: CV build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: # cv-merge, overleaf-sync and the weekly update start this for bot-made branches

permissions:
  contents: read

concurrency:
  group: cv-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test the checkers
        run: python3 -m unittest discover -s scripts/tests
      - name: Check scholar.bib and the category lists (errors, and warnings not in the baseline)
        run: python3 scripts/check_cv.py
      - name: template/ is the release named in cv.toml
        # Format changes go to the template repository and arrive as a release
        # (CLAUDE.md); an edit made here would be lost at the next update.
        run: |
          sh scripts/update_template.sh "$(python3 scripts/cvlib.py template.version)" >/dev/null
          if [ -n "$(git status --porcelain -- template)" ]; then
            git status --short -- template
            echo "::error::template/ differs from release $(python3 scripts/cvlib.py template.version) of $(python3 scripts/cvlib.py template.repo). Make the change in the template repository and release it; don't edit template/ here."
            exit 1
          fi
      - name: Keep personal data out of the template
        run: |
          # The template's own repository URL and citation file may name its author.
          repo=$(python3 scripts/cvlib.py template.repo)
          if grep -rIn -i --exclude=CITATION.cff 'wallace' template/ | grep -v -i -F -- "github.com/$repo"; then
            echo "::error::template/ must not contain CV data (see template/CLAUDE.md)."
            exit 1
          fi

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Compile main.tex, apr.tex, the review copy gaps.tex and the APR letters (TeX Live, latexmk + biber)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          docker_image: ghcr.io/xu-cheng/texlive-debian:20261001@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e # TeX Live 2026, 2026-10-01 snapshot
          latexmk_use_lualatex: true # the engine latexmkrc names; the action's -pdf would override it
          root_file: |
            main.tex
            apr.tex
            gaps.tex
            cover-letter.tex
            external-input-letter.tex
      - name: Name the PDFs
        run: |
          mkdir -p out
          cp main.pdf out/Wallace-CV.pdf
          cp apr.pdf  out/Wallace-CV-APR.pdf
          cp gaps.pdf out/Wallace-CV-gaps.pdf
          cp cover-letter.pdf out/Wallace-APR-cover-letter.pdf
          cp external-input-letter.pdf out/Wallace-APR-external-input-letter.pdf
      - name: Missing data (marked in orange in Wallace-CV-gaps.pdf)
        run: |
          { echo "### Missing data: $(python3 scripts/gaps.py --list | wc -l) entries"
            echo "Marked in orange in Wallace-CV-gaps.pdf (the review copy; never published as the CV)."
            echo '```'; python3 scripts/gaps.py --list; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cv-pdfs
          path: out/*.pdf
      - name: No warnings beyond the baseline (LaTeX and biber)
        # On main the merge has happened; report, but still publish the PDFs.
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        run: python3 scripts/warning_ratchet.py main apr
      - name: PDF/UA-2 and PDF/A-4f (veraPDF)
        continue-on-error: ${{ github.ref == 'refs/heads/main' }}
        run: sh scripts/check_pdfa.sh main.pdf apr.pdf
      - name: Fonts embedded; what changed in the PDFs since main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          gh release download cv-latest --pattern 'Wallace-CV*.pdf' --dir ref 2>/dev/null \
            || echo "No cv-latest release to compare with."
          python3 scripts/pdf_report.py main.pdf apr.pdf \
            --against ref/Wallace-CV.pdf ref/Wallace-CV-APR.pdf

  template:
    # The template on its own: its fictional example CV must build in both versions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Compile the template example (plain and APR)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4.1.0
        with:
          docker_image: ghcr.io/xu-cheng/texlive-debian:20261001@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e # TeX Live 2026, 2026-10-01 snapshot
          working_directory: template/example
          latexmk_use_lualatex: true # the engine latexmkrc names; the action's -pdf would override it
          root_file: |
            example.tex
            example-apr.tex
      - name: No warnings beyond the baseline (LaTeX and biber)
        run: python3 scripts/warning_ratchet.py example example-apr
      - name: PDF/UA-2 and PDF/A-4f (veraPDF)
        run: sh scripts/check_pdfa.sh template/example/example.pdf template/example/example-apr.pdf

  gate:
    # A PR labelled needs-review can't pass, so nothing merges it by accident.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Block PRs labelled needs-review
        if: contains(github.event.pull_request.labels.*.name, 'needs-review')
        run: |
          echo "::error::This PR is labelled needs-review. Remove the label when you're happy with it."
          exit 1
      - run: echo "No blocking label."

  review:
    # Two agentic reviewers, .claude/agents/consistency-reviewer.md and
    # repetition-reviewer.md, read the PR's diff and the rendered PDFs and post one PR
    # comment (updated on each push). A FAIL (an inconsistency or duplicate the PR itself
    # adds, with a definite fix) labels the PR needs-review, so CV auto-merge skips it;
    # judgment calls and findings in untouched content are comment-only. Advisory
    # otherwise: a missing secret or an outage never fails the build.
    # It is a job here, not its own workflow, because CV auto-merge fires when this
    # workflow completes; a separate one could finish after the merge. Skipped on cv/
    # branches (the weekly job runs both reviewers in its session, cv-verify) and on label
    # changes (removing needs-review after reading the comment shouldn't re-review).
    # Needs the CLAUDE_CODE_OAUTH_TOKEN secret, as claude.yml does.
    if: >-
      github.ref != 'refs/heads/main' &&
      !startsWith(github.head_ref || github.ref_name, 'cv/') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.action != 'labeled' && github.event.action != 'unlabeled'))
    needs: [compile]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Find the PR
        id: pr
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret, so the consistency and repetition reviewers are off."
            exit 0
          fi
          num=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then echo "No open PR for $BRANCH; nothing to review."; exit 0; fi
          echo "num=$num" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.pr.outputs.num
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: steps.pr.outputs.num
        with:
          name: cv-pdfs
          path: .review/pdf
      - name: Extract the text a reader sees
        if: steps.pr.outputs.num
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p .review/text
          for f in Wallace-CV-APR Wallace-APR-cover-letter Wallace-APR-external-input-letter; do
            # A document CI no longer builds is skipped, not an error.
            [ -f ".review/pdf/$f.pdf" ] || { echo "::notice::$f.pdf was not built; not reviewed."; continue; }
            pdftotext -layout -enc UTF-8 ".review/pdf/$f.pdf" ".review/text/$f.txt"
          done
          ls -l .review/text
      - name: Consistency and repetition reviewers
        if: steps.pr.outputs.num
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are the review step of this repository's CI, for PR #${{ steps.pr.outputs.num }}.
            Read CLAUDE.md. Then launch two sub-agents in parallel, in one message:
            `consistency-reviewer` and `repetition-reviewer` (.claude/agents/). If those agent
            types aren't available, start general-purpose sub-agents instead, each given the
            full text of the matching .claude/agents/<name>.md (below its front matter) as its
            instructions. Give each only these inputs, and none of your own views:
              - mode: `diff` (they run `git diff origin/main...HEAD` themselves);
              - rendered text: every file in .review/text/ (the APR version of the CV and
                the APR letters).
            When both have reported, write the file .review/review.md and nothing else:
            line 1 `CONSISTENCY: <its VERDICT>`, line 2 `REPETITION: <its VERDICT>`, a blank
            line, then `### Consistency` and its report verbatim, then `### Repetition` and
            its report verbatim. Do not edit any other file, fix anything, or post to GitHub.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Agent,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(python3 scripts/check_cv.py:*),Bash(python3 scripts/cv_numbers.py:*),Bash(python3 scripts/gaps.py:*)"
      - name: Post the review; label needs-review on a FAIL
        if: steps.pr.outputs.num
        env:
          NUM: ${{ steps.pr.outputs.num }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          marker='<!-- cv-review -->'
          if [ -s .review/review.md ]; then
            c=$(sed -n 's/^CONSISTENCY: *//p' .review/review.md | head -1)
            r=$(sed -n 's/^REPETITION: *//p' .review/review.md | head -1)
            report=$(tail -n +3 .review/review.md | head -c 60000)
          else
            c=DID-NOT-RUN; r=DID-NOT-RUN
            report="The reviewers did not produce a report (see the CV build log). Run them in a session: the cv-verify skill."
          fi
          body=$(printf '%s\n## Consistency and repetition review\n\nCommit %s. Consistency: **%s**. Repetition: **%s**.\nA FAIL is something this PR adds that has a definite fix; it labels the PR `needs-review`. QUESTIONS and "Elsewhere" rows are for Jim to decide and never block. Remove the label once handled.\n\n<details><summary>Reports</summary>\n\n%s\n\n</details>\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
            "$marker" "${SHA::7}" "$c" "$r" "$report")
          id=$(gh api "repos/$GH_REPO/issues/$NUM/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GH_REPO/issues/$NUM/comments" -f body="$body" >/dev/null
          fi
          echo "Consistency: $c. Repetition: $r." | tee -a "$GITHUB_STEP_SUMMARY"
          # A label added with the workflow token starts no new run; CV auto-merge reads
          # the labels when this run completes and skips the PR.
          if [ "$c" = FAIL ] || [ "$r" = FAIL ]; then
            gh label create needs-review --color d93f0b --force >/dev/null 2>&1 || true
            gh api "repos/$GH_REPO/issues/$NUM/labels" -f 'labels[]=needs-review' >/dev/null
            echo "Labelled PR #$NUM needs-review." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  ratchet:
    # Claude writes, CI verifies, so a change that loosens the verification itself
    # (accepts new warnings, or edits the checks) is not merged automatically.
    # This job fails for such a PR; Jim merges it by hand. Not a required check.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: The warning baseline only shrinks
        run: python3 scripts/warning_ratchet.py --growth "$(git merge-base origin/main HEAD)"
      - name: The checks are unchanged
        run: |
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD -- .github/workflows/cv-build.yml \
            .github/workflows/cv-merge.yml scripts/check_cv.py scripts/cvlib.py \
            scripts/warning_ratchet.py scripts/pdf_report.py scripts/check_pdfa.sh scripts/tests)
          if [ -n "$changed" ]; then
            for f in $changed; do echo "::error file=$f::This PR changes the checks; merge it by hand."; done
            exit 1
          fi
          echo "The checks are unchanged."

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [lint, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cv-pdfs
          path: out
      - name: Update the cv-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
          if gh release view cv-latest >/dev/null 2>&1; then
            gh release edit cv-latest --notes "$notes"
          else
            gh release create cv-latest --title "Latest CV" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload cv-latest out/Wallace-CV.pdf out/Wallace-CV-APR.pdf --clobber

  preview:
    # A PR from this repository also puts its two PDFs on the "cv-preview" prerelease, so
    # Jim (or a Claude session, which can't fetch build artifacts) can read them before
    # merging. One prerelease, overwritten by the latest PR build; its notes name the PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cv-pdfs
          path: out
      - name: Update the cv-preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          notes="Preview of PR #$PR, built from ${SHA::7} on $(date -u +%Y-%m-%d). Not the published CV: that is cv-latest."
          if gh release view cv-preview >/dev/null 2>&1; then
            gh release edit cv-preview --notes "$notes"
          else
            gh release create cv-preview --prerelease --title "Preview of an open PR" --notes "$notes" --target "$SHA"
          fi
          gh release upload cv-preview out/Wallace-CV.pdf out/Wallace-CV-APR.pdf out/Wallace-CV-gaps.pdf out/Wallace-APR-cover-letter.pdf out/Wallace-APR-external-input-letter.pdf --clobber
          # The salary anomaly letter is no longer built (Jim, 2026-11-25); remove the copy
          # earlier builds uploaded. A no-op once it is gone.
          gh release delete-asset cv-preview Wallace-salary-anomaly-letter.pdf --yes 2>/dev/null || true
