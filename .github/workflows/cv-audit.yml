# Before an APR goes in: the consistency and repetition reviewers read the whole published
# CV (the cv-latest release, i.e. main) and the APR letters, not just one PR's diff, so
# drift that built up across many PRs shows. The findings go in one issue, labelled
# needs-review, for Jim to decide; nothing is changed. APR files are due the last working
# day of December of even years (CLAUDE.md), so the schedule fires on 1 December and runs
# only in even years; run it by hand any time from the Actions tab.
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret, as claude.yml does.
name: CV audit

on:
  schedule:
    - cron: "23 13 1 12 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Should this run?
        id: go
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN secret, so the audit is off."; exit 0
          fi
          if [ "${{ github.event_name }}" = schedule ] && [ $(( $(date -u +%Y) % 2 )) -ne 0 ]; then
            echo "No APR due this December."; exit 0
          fi
          echo "run=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.go.outputs.run
      - name: The published PDFs, as text
        if: steps.go.outputs.run
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          gh release download cv-latest --pattern 'Wallace-CV-APR.pdf' --dir .review/pdf
          # The letters are built on PRs only (cv-preview); build-free fallback: their sources.
          gh release download cv-preview --pattern 'Wallace-*letter.pdf' --dir .review/pdf 2>/dev/null || true
          mkdir -p .review/text
          for f in .review/pdf/*.pdf; do
            pdftotext -layout -enc UTF-8 "$f" ".review/text/$(basename "$f" .pdf).txt"
          done
          ls -l .review/text
      - name: Consistency and repetition reviewers, whole CV
        if: steps.go.outputs.run
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            You are the pre-APR audit of this repository. Read CLAUDE.md. Then launch two
            sub-agents in parallel, in one message: `consistency-reviewer` and
            `repetition-reviewer` (.claude/agents/). If those agent types aren't available,
            start general-purpose sub-agents instead, each given the full text of the matching
            .claude/agents/<name>.md (below its front matter) as its instructions. Give each
            only these inputs, and none of your own views:
              - mode: `full`;
              - rendered text: every file in .review/text/ (the APR version of the CV from
                the cv-latest release, and the letters from cv-preview where present; the
                letters may be from an open PR, so check them against letters/*.tex and
                review the sources where they differ).
            When both have reported, write the file .review/review.md and nothing else:
            `### Consistency` and its report verbatim, then `### Repetition` and its report
            verbatim. Do not edit any other file, fix anything, or post to GitHub.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Agent,Write,Bash(git log:*),Bash(git show:*),Bash(python3 scripts/check_cv.py:*),Bash(python3 scripts/cv_numbers.py:*),Bash(python3 scripts/gaps.py:*)"
      - name: Open or update the audit issue
        if: steps.go.outputs.run
        run: |
          test -s .review/review.md || { echo "::error::The reviewers wrote no report."; exit 1; }
          year=$(date -u +%Y)
          title="CV consistency and repetition audit, $year"
          body=$(printf 'The consistency and repetition reviewers read the whole CV (cv-latest) and the APR letters on %s. Proposals only: deciding what to change, keep or remove is yours. Mechanical kinds of finding ("Could be a check_cv.py rule") can become deterministic checks.\n\n%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' \
            "$(date -u +%Y-%m-%d)" "$(head -c 60000 .review/review.md)")
          gh label create needs-review --color d93f0b --force >/dev/null 2>&1 || true
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
          else
            gh issue create --title "$title" --label needs-review --body "$body"
          fi
